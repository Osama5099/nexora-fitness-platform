spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: aiactivityfitness

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    prefer-ip-address: false

server:
  port: ${PORT:8082}